<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Auto Video Splitter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .file-name {
            margin-top: 10px;
            color: #667eea;
            font-weight: bold;
        }
        .form-group {
            margin: 20px 0;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .progress-section {
            display: none;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            width: 0%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .result-section {
            display: none;
            margin-top: 20px;
        }
        .episode-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .episode-item {
            background: #f8f9fa;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .download-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
        .download-btn:hover {
            background: #218838;
        }
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Auto Video Splitter</h1>
        <p class="subtitle">Potong video otomatis menjadi beberapa episode</p>
        
        <div class="upload-area" id="dropZone">
            <div class="upload-icon">📁</div>
            <p><strong>Klik atau drag & drop</strong> file video di sini</p>
            <p style="color: #888; font-size: 14px;">MP4, AVI, MKV, dll (max 1GB)</p>
            <div class="file-name" id="fileName"></div>
            <input type="file" id="fileInput" accept="video/*">
        </div>

        <div class="form-group">
            <label for="durasi">⏱️ Durasi per Episode (menit)</label>
            <input type="number" id="durasi" value="5" min="1" max="120">
        </div>

        <button class="btn" id="processBtn" disabled>🚀 Proses Split</button>

        <div class="progress-section" id="progressSection">
            <h3>⏳ Memproses...</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <p id="statusText" style="text-align: center; color: #666;"></p>
        </div>

        <div class="result-section" id="resultSection">
            <h3>✅ Selesai!</h3>
            <p><strong>Total Episode:</strong> <span id="totalEpisodes">0</span></p>
            <div class="episode-list" id="episodeList"></div>
            <a href="#" class="download-btn" id="downloadBtn">📥 Download Semua (ZIP)</a>
        </div>

        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const processBtn = document.getElementById('processBtn');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const resultSection = document.getElementById('resultSection');
        const episodeList = document.getElementById('episodeList');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMsg = document.getElementById('errorMsg');
        const durasiInput = document.getElementById('durasi');

        let selectedFile = null;

        // Drag & Drop
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            fileName.textContent = `📹 ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
            processBtn.disabled = false;
            errorMsg.style.display = 'none';
            resultSection.style.display = 'none';
        }

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            processBtn.disabled = true;
            progressSection.style.display = 'block';
            resultSection.style.display = 'none';
            errorMsg.style.display = 'none';
            
            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('durasi', durasiInput.value);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                // Simulasi progress (karena FFmpeg di backend)
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 2;
                    if (progress <= 90) {
                        progressFill.style.width = progress + '%';
                        progressFill.textContent = progress + '%';
                        statusText.textContent = `Memotong video... ${Math.round(progress)}%`;
                    }
                }, 200);

                const data = await response.json();
                clearInterval(interval);

                if (data.error) {
                    throw new Error(data.error);
                }

                // Selesai
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                statusText.textContent = '✅ Selesai!';
                
                // Tampilkan hasil
                setTimeout(() => {
                    showResult(data);
                }, 500);

            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
                progressSection.style.display = 'none';
            } finally {
                processBtn.disabled = false;
            }
        });

        function showResult(data) {
            resultSection.style.display = 'block';
            document.getElementById('totalEpisodes').textContent = data.total_episodes;
            
            episodeList.innerHTML = '';
            data.episodes.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'episode-item';
                div.innerHTML = `
                    <span>🎬 Episode ${ep.episode}</span>
                    <span style="color: #666; font-size: 14px;">
                        ${ep.duration} | ${ep.size}
                    </span>
                `;
                episodeList.appendChild(div);
            });
            
            downloadBtn.href = data.download_url;
            downloadBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
